<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    <link rel="stylesheet" href="${styleUri}">
</head>
<body>
    <div class="container">
        <!-- Welcome/No Content State -->
        <div class="welcome-state" id="welcomeState">
            <div class="welcome-icon">🤖</div>
            <div class="welcome-title">AI Code Assistant</div>
            <div class="welcome-subtitle">
                Select an AI action below to analyze your open file
            </div>
        </div>

        <!-- No Editor State -->
        <div class="no-editor" id="noEditor">
            <div class="no-editor-icon">📄</div>
            <div class="no-editor-title">No active editor</div>
            <div class="no-editor-subtitle">
                Open a file in the editor to analyze your code with AI
            </div>
        </div>

        <!-- AI Action Buttons Section -->
        <div class="section" id="actionsSection">
            <div class="section-title">AI Actions</div>
            
            <!-- Single loading indicator -->
            <div class="analyze-section" id="loadingSection" style="display: none;">
                <div class="loading-spinner" id="loadingSpinner">⟳ Processing...</div>
            </div>

            <div class="action-buttons">
                <button class="button" onclick="checkMyCode()" id="checkButton">
                    🔍 Check my Code
                </button>
                
                <button class="button" onclick="improveMyCode()" id="improveButton">
                    ✨ Improve my Code
                </button>
                
                <button class="button" onclick="suggestTestCases()" id="testButton">
                    🧪 Suggest test Cases
                </button>
            </div>
        </div>

        <!-- AI Response Section -->
        <div class="section response-section" id="responseSection">
            <div class="response-header">
                <h3 id="responseTitle" class="section-title">AI Response</h3>
            </div>
            <div class="response-content" id="responseContent"></div>
        </div>
    </div>

    <script src="${scriptUri}"></script>
</body>
</html>
